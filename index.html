<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f0f">
<title>有聲書庫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --gold: #c9a84c;
  --gold-dim: #8a6f2e;
  --text: #e8e8e8;
  --text-dim: #777;
  --hl: rgba(201,168,76,0.35);
  --hl-done: rgba(201,168,76,0.12);
  --font-size: 17px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'PingFang TC','Hiragino Sans GB','Noto Serif TC',serif; }

/* ─── SCREENS ─── */
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); transition: opacity 0.25s, transform 0.25s; }
.screen.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); visibility: hidden; }

/* ═══════════════════════════════
   LIBRARY SCREEN
═══════════════════════════════ */
#lib-topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  padding-top: calc(14px + var(--safe-t));
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
#lib-topbar h1 { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.05em; }

#add-btn {
  background: var(--gold); color: #000;
  border: none; padding: 8px 18px; border-radius: 20px;
  font-size: 13px; font-weight: 700; cursor: pointer; letter-spacing: 0.02em;
}

#lib-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 24px 20px;
}
#lib-body::-webkit-scrollbar { display: none; }

#lib-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 50vh; gap: 16px; color: var(--text-dim); text-align: center;
}
#lib-empty .icon { font-size: 56px; }
#lib-empty p { font-size: 15px; line-height: 1.7; }

#book-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
}

.book-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  position: relative;
}
.book-card:active { transform: scale(0.97); }
.book-card:hover { border-color: var(--gold-dim); }

.book-cover {
  width: 100%; aspect-ratio: 3/4;
  background: linear-gradient(135deg, var(--surface2) 0%, #1e1a12 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 12px; gap: 8px;
}
.book-cover .cover-icon { font-size: 36px; }
.book-cover .cover-title {
  font-size: 12px; color: var(--gold); text-align: center;
  line-height: 1.4; display: -webkit-box;
  -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

.book-info { padding: 10px 12px 12px; }
.book-name {
  font-size: 13px; color: var(--text); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  margin-bottom: 8px;
}
.book-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }

.book-progress-bar {
  width: 100%; height: 3px; background: var(--border); border-radius: 2px;
}
.book-progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.3s; }

.book-delete {
  position: absolute; top: 6px; right: 6px;
  background: rgba(0,0,0,0.6); border: none; color: var(--text-dim);
  width: 24px; height: 24px; border-radius: 50%; font-size: 12px;
  cursor: pointer; display: none; align-items: center; justify-content: center;
}
.book-card:hover .book-delete { display: flex; }

#file-input { display: none; }

/* ═══════════════════════════════
   READER SCREEN
═══════════════════════════════ */
#topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  padding-top: calc(10px + var(--safe-t));
  flex-shrink: 0; min-height: 52px;
}
#btn-back {
  background: none; border: none; color: var(--gold);
  font-size: 20px; cursor: pointer; padding: 4px; flex-shrink: 0; line-height: 1;
}
#book-title {
  flex: 1; font-size: 13px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#btn-menu {
  background: none; border: none; color: var(--text-dim);
  font-size: 20px; cursor: pointer; padding: 4px; flex-shrink: 0; line-height: 1;
}

/* drawer */
#drawer-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
}
#drawer-overlay.open { display: block; }
#drawer {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: min(280px, 85vw);
  background: var(--surface); border-right: 1px solid var(--border);
  z-index: 201; display: flex; flex-direction: column;
  transform: translateX(-100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1);
}
#drawer.open { transform: translateX(0); }
#drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px; padding-top: calc(16px + var(--safe-t));
  border-bottom: 1px solid var(--border);
}
#drawer-header span { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
#btn-close-drawer { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }

#font-control { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
#font-control label { font-size: 12px; color: var(--text-dim); }
#font-row { display: flex; align-items: center; gap: 10px; }
.font-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); width: 36px; height: 36px; border-radius: 8px;
  font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#font-slider {
  -webkit-appearance: none; flex: 1; height: 4px;
  background: var(--border); border-radius: 2px; outline: none;
}
#font-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--gold); cursor: pointer;
}
#font-size-display { font-size: 12px; color: var(--gold); min-width: 32px; text-align: right; }

#tts-control { padding: 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
#tts-control label { font-size: 12px; color: var(--text-dim); }
#tts-server-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: 12px; outline: none; width: 100%; }
#tts-server-input::placeholder { color: var(--text-dim); }
#tts-voice-row { display: flex; gap: 8px; align-items: center; }
#tts-voice-select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 8px; border-radius: 8px; font-size: 12px; flex: 1; outline: none; }
.tts-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.tts-dot.ok { background: #5dba7e; }
.tts-dot.err { background: #e05252; }
#tts-status { font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
#tts-test-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-left: auto; }

#toc-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; }
#toc-list::-webkit-scrollbar { display: none; }
.toc-item {
  padding: 12px 16px; font-size: 14px; cursor: pointer;
  color: var(--text-dim); border-left: 2px solid transparent; line-height: 1.5;
}
.toc-item:active { background: var(--surface2); }
.toc-item.active { color: var(--gold); border-left-color: var(--gold); background: var(--surface2); }
.page-item { padding: 10px 16px; font-size: 13px; cursor: pointer; color: var(--text-dim); }
.page-item:active { background: var(--surface2); }
.page-item.active { color: var(--gold); background: var(--surface2); }

/* reader body */
#reader {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 28px 20px 20px; font-size: var(--font-size); line-height: 1.95; letter-spacing: 0.04em;
}
#reader::-webkit-scrollbar { display: none; }
#page-content { max-width: 700px; margin: 0 auto; }

.sentence { display: inline; }
.sentence.speaking { background: var(--hl); border-radius: 4px; padding: 1px 3px; box-shadow: 0 0 0 1px rgba(201,168,76,0.3); }
.sentence.done { background: var(--hl-done); border-radius: 4px; padding: 1px 3px; }

#reader-welcome, #reader-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 40vh; gap: 16px; color: var(--text-dim); text-align: center;
}
#reader-loading { display: none; }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* controls */
#controls {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 12px 16px; padding-bottom: calc(12px + var(--safe-b));
  flex-shrink: 0; display: flex; flex-direction: column; gap: 10px;
}
#prog-row { display: flex; align-items: center; gap: 10px; }
#pg-info { font-size: 11px; color: var(--text-dim); white-space: nowrap; min-width: 48px; }
#progress-bar-wrap { flex: 1; height: 6px; background: var(--border); border-radius: 3px; cursor: pointer; }
#progress-bar { height: 100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold)); border-radius: 3px; width: 0%; transition: width 0.4s; }
#sentence-info { font-size: 11px; color: var(--text-dim); white-space: nowrap; text-align: right; }

#play-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.ctrl-btn {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn:disabled { opacity: 0.25; pointer-events: none; }
.ctrl-btn.sm { width: 46px; height: 46px; font-size: 16px; }
.ctrl-btn.md { width: 52px; height: 52px; font-size: 18px; }
.ctrl-btn.lg { width: 64px; height: 64px; background: var(--gold); border-color: var(--gold); color: #000; font-size: 26px; }
.ctrl-btn.lg:active { background: #a8872f; }

#speed-select {
  background: var(--surface2); border: 1px solid var(--border); color: var(--text);
  padding: 6px 10px; border-radius: 20px; font-size: 12px; cursor: pointer; outline: none; min-width: 64px;
}
#page-jump { display: flex; align-items: center; gap: 5px; }
#page-jump span { font-size: 11px; color: var(--text-dim); }
#page-input { width: 44px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 4px; border-radius: 8px; font-size: 12px; text-align: center; outline: none; }

#timer-area { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
#timer-display { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--gold); letter-spacing: 0.05em; line-height: 1; }
#timer-label { font-size: 10px; color: var(--text-dim); white-space: nowrap; }
#timer-bar-wrap { width: 48px; height: 3px; background: var(--border); border-radius: 2px; }
#timer-bar { height: 100%; background: var(--gold); border-radius: 2px; width: 0%; transition: width 1s linear; }

/* desktop */
@media (min-width: 700px) {
  #reader-shell { flex: 1; display: flex; overflow: hidden; }
  #drawer-overlay { display: none !important; }
  #drawer { position: static; width: 220px; transform: none !important; transition: none; border-right: 1px solid var(--border); }
  #btn-menu { display: none; }
  #reader { padding: 40px 48px; }
  #book-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}
@media (max-width: 699px) {
  #reader-shell { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
}
</style>
</head>
<body>

<!-- ═══════════ LIBRARY SCREEN ═══════════ -->
<div class="screen" id="screen-library">
  <div id="lib-topbar">
    <h1>📚 我的書庫</h1>
    <button id="add-btn" onclick="document.getElementById('file-input').click()">＋ 新增書籍</button>
    <input type="file" id="file-input" accept=".pdf">
  </div>
  <div id="lib-body">
    <div id="lib-empty">
      <div class="icon">📖</div>
      <p>點擊「新增書籍」上傳 PDF<br>上傳後永久儲存，隨時開啟</p>
    </div>
    <div id="book-grid" style="display:none"></div>
  </div>
</div>

<!-- ═══════════ READER SCREEN ═══════════ -->
<div class="screen hidden" id="screen-reader">
  <div id="topbar">
    <button id="btn-back" onclick="goLibrary()" title="回書庫">‹</button>
    <span id="book-title">—</span>
    <button id="btn-menu" onclick="openDrawer()">☰</button>
  </div>

  <div id="reader-shell">
    <!-- Drawer overlay -->
    <div id="drawer-overlay" onclick="closeDrawer()"></div>

    <!-- Sidebar / Drawer -->
    <div id="drawer">
      <div id="drawer-header">
        <span>目錄</span>
        <button id="btn-close-drawer" onclick="closeDrawer()">✕</button>
      </div>
      <div id="font-control">
        <label>字體大小</label>
        <div id="font-row">
          <button class="font-btn" onclick="adjustFont(-1)">A−</button>
          <input type="range" id="font-slider" min="13" max="28" value="17" oninput="setFont(this.value)">
          <button class="font-btn" onclick="adjustFont(1)">A+</button>
          <span id="font-size-display">17px</span>
        </div>
      </div>
      <div id="tts-control">
        <label>語音引擎（Edge-TTS）</label>
        <input type="text" id="tts-server-input" placeholder="http://192.168.x.x:5678" oninput="setEdgeTtsUrl(this.value)">
        <div id="tts-voice-row">
          <select id="tts-voice-select" onchange="setEdgeTtsVoice(this.value)">
            <option value="zh-TW-HsiaoChenNeural">小陳（女）</option>
            <option value="zh-TW-YunJheNeural">雲哲（男）</option>
            <option value="zh-TW-HsiaoYuNeural">小玉（女）</option>
          </select>
          <button id="tts-test-btn" onclick="testEdgeTts()">測試</button>
        </div>
        <div id="tts-status"><div class="tts-dot" id="tts-dot"></div><span id="tts-status-text">未設定</span></div>
      </div>
      <div id="toc-list"></div>
    </div>

    <!-- Reader -->
    <div id="reader">
      <div id="reader-welcome">
        <div class="spinner" style="display:none"></div>
      </div>
      <div id="reader-loading">
        <div class="spinner"></div>
        <span style="font-size:14px">正在載入…</span>
      </div>
      <div id="page-content"></div>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="prog-row">
      <span id="pg-info">— / —</span>
      <div id="progress-bar-wrap" onclick="seekProgress(event)"><div id="progress-bar"></div></div>
      <span id="sentence-info"></span>
      <div id="timer-area">
        <div id="timer-display">00:00</div>
        <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
        <span id="timer-label">30min 目標</span>
      </div>
    </div>
    <div id="play-row">
      <div id="page-jump">
        <span>P</span>
        <input type="number" id="page-input" min="1" value="1" onkeydown="if(event.key==='Enter')jumpToPage()" onblur="jumpToPage()">
      </div>
      <button class="ctrl-btn md" id="btn-prev" onclick="prevPage()" disabled>◀</button>
      <button class="ctrl-btn sm" id="btn-stop" onclick="stopSpeech()" disabled>■</button>
      <button class="ctrl-btn lg" id="btn-play" onclick="togglePlay()" disabled>▶</button>
      <button class="ctrl-btn sm" id="btn-step" onclick="stepForward()" disabled>↷</button>
      <button class="ctrl-btn md" id="btn-next" onclick="nextPage()" disabled>▶</button>
      <select id="speed-select" onchange="changeSpeed(this.value)">
        <option value="0.75">0.75×</option>
        <option value="0.9">0.9×</option>
        <option value="1" selected>1×</option>
        <option value="1.2">1.2×</option>
        <option value="1.5">1.5×</option>
        <option value="1.8">1.8×</option>
        <option value="2">2×</option>
      </select>
    </div>
  </div>
</div>

<script>
if (typeof pdfjsLib === 'undefined') {
  document.getElementById('lib-empty').innerHTML =
    '<div class="icon">⚠️</div><p>PDF 模組載入失敗，請檢查網路後重新整理</p>';
  document.getElementById('lib-empty').style.display = 'flex';
} else {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ══════════════════════════════════════
//  IndexedDB
// ══════════════════════════════════════
const DB_NAME = 'AudiobookLibrary', DB_VER = 1;
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('books')) {
        d.createObjectStore('books', { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}

function dbPut(book) {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readwrite');
    tx.objectStore('books').put(book);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

function dbGet(id) {
  return new Promise((res, rej) => {
    const req = db.transaction('books').objectStore('books').get(id);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbGetAll() {
  return new Promise((res, rej) => {
    const req = db.transaction('books').objectStore('books').getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function dbDelete(id) {
  return new Promise((res, rej) => {
    const tx = db.transaction('books', 'readwrite');
    tx.objectStore('books').delete(id);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

// ══════════════════════════════════════
//  Library
// ══════════════════════════════════════
async function initLibrary() {
  try {
    await openDB();
    renderLibrary();
  } catch (e) {
    console.error('DB init failed:', e);
    document.getElementById('lib-empty').innerHTML =
      `<div class="icon">⚠️</div><p>儲存空間初始化失敗<br><small style="color:var(--text-dim)">${e.message || e}</small><br><br>請確認不是私人模式，然後重新整理</p>`;
    document.getElementById('lib-empty').style.display = 'flex';
  }
}

async function renderLibrary() {
  const books = await dbGetAll();
  const grid = document.getElementById('book-grid');
  const empty = document.getElementById('lib-empty');

  if (!books.length) {
    empty.style.display = 'flex';
    grid.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  grid.style.display = 'grid';
  grid.innerHTML = '';

  books.sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0));

  for (const book of books) {
    const pct = book.totalPages ? Math.round((book.lastPage || 1) / book.totalPages * 100) : 0;
    const card = document.createElement('div');
    card.className = 'book-card';
    const coverInner = book.cover
      ? `<img src="${book.cover}" style="width:100%;height:100%;object-fit:cover;display:block">`
      : `<div class="cover-icon">📖</div><div class="cover-title">${escHtml(book.title)}</div>`;
    card.innerHTML = `
      <div class="book-cover">${coverInner}</div>
      <div class="book-info">
        <div class="book-name">${escHtml(book.title)}</div>
        <div class="book-meta">第 ${book.lastPage || 1} 頁 · ${pct}%</div>
        <div class="book-progress-bar">
          <div class="book-progress-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <button class="book-delete" onclick="deleteBook(event,'${book.id}')">✕</button>
    `;
    card.addEventListener('click', () => openBook(book.id));
    grid.appendChild(card);
  }
}

document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  e.target.value = '';

  const id = 'book_' + Date.now();
  const title = file.name.replace(/\.pdf$/i, '');
  const pdfData = await file.arrayBuffer();
  const cover = await generateCover(pdfData); // 上傳時就生成書封

  const book = { id, title, pdfData, cover, lastPage: 1, lastSentence: 0, totalPages: 0, timerSeconds: 0, addedAt: Date.now(), lastOpened: Date.now() };
  await dbPut(book);
  openBook(id);
});

async function deleteBook(e, id) {
  e.stopPropagation();
  if (!confirm('確定要刪除這本書嗎？')) return;
  await dbDelete(id);
  renderLibrary();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function generateCover(pdfData) {
  // 上傳時用：從 ArrayBuffer 生成
  try {
    const pdf = await pdfjsLib.getDocument({ data: pdfData.slice(0) }).promise;
    return await renderCoverFromDoc(pdf);
  } catch(e) { return null; }
}

async function renderCoverFromDoc(doc) {
  // 開書時用：直接用已載入的 pdfDoc，不重複佔記憶體
  try {
    const page = await doc.getPage(1);
    const baseVp = page.getViewport({ scale: 1 });
    const scale = 200 / baseVp.width;
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = vp.width; canvas.height = vp.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    return canvas.toDataURL('image/jpeg', 0.55);
  } catch(e) { return null; }
}

// ══════════════════════════════════════
//  Reader state
// ══════════════════════════════════════
let currentBookId = null;
let pdfDoc = null, totalPages = 0, currentPage = 1;
let pageTexts = {}, sentences = [], sentenceIdx = 0;
let speaking = false, paused = false, utterance = null;
let selectedVoice = null, voices = [], speed = 1.0;
let edgeTtsUrl = localStorage.getItem('edgeTtsUrl') || '';
let edgeTtsVoice = localStorage.getItem('edgeTtsVoice') || 'zh-TW-HsiaoChenNeural';
let currentAudio = null, prefetchIdx = -1, prefetchBlob = null;
let timerSeconds = 0, timerInterval = null;
const GOAL = 1800;
let saveDebounce = null;
let speechWatchdog = null;

// voices
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const zh = voices.filter(v => v.lang.startsWith('zh'));
  const kws = ['male','Male','Ming','Liang','Yu','Zhiyu','Kangkang','Danny','Sinji'];
  let best = null;
  for (const kw of kws) { best = zh.find(v => v.name.includes(kw)); if (best) break; }
  selectedVoice = best || zh[0] || null;
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// ── open book ──
async function openBook(id) {
  showScreen('reader');
  showReaderState('loading');

  const book = await dbGet(id);
  if (!book) { goLibrary(); return; }

  currentBookId = id;
  book.lastOpened = Date.now();
  await dbPut(book);

  document.getElementById('book-title').textContent = book.title;
  document.getElementById('page-input').max = book.totalPages || 9999;

  // restore timer
  timerSeconds = book.timerSeconds || 0;
  updateTimer();

  try {
    pdfDoc = await pdfjsLib.getDocument({ data: book.pdfData.slice(0) }).promise;
  } catch (e) {
    showReaderState('welcome');
    document.getElementById('reader-welcome').innerHTML =
      `<div class="icon" style="font-size:40px">⚠️</div><p style="font-size:14px;color:var(--text-dim)">PDF 載入失敗<br><small>${e.message || e}</small></p>`;
    document.getElementById('reader-welcome').style.display = 'flex';
    return;
  }
  totalPages = pdfDoc.numPages;
  document.getElementById('page-input').max = totalPages;

  if (!book.totalPages) { book.totalPages = totalPages; await dbPut(book); }

  pageTexts = {};
  await buildTOC();

  // localStorage 備份比 DB 更可靠（iOS 強制關閉也能讀到）
  const pos = getPositionSync(id);
  const startPage = pos ? pos.p : (book.lastPage || 1);
  const startSent = pos ? pos.s : (book.lastSentence || 0);
  await renderPage(startPage, startSent);

  // 背景補生成書封（直接用已載入的 pdfDoc，不重複佔記憶體）
  if (!book.cover) {
    renderCoverFromDoc(pdfDoc).then(async cover => {
      if (!cover) return;
      const b = await dbGet(id);
      if (b && !b.cover) {
        b.cover = cover;
        await dbPut(b);
        renderLibrary(); // 回到書庫時立即顯示
      }
    });
  }

  showReaderState('content');
  enableControls(true);
}

// ── back to library ──
async function goLibrary() {
  await saveNow();       // 離開前確保存好進度
  stopSpeech();
  showScreen('library');
  renderLibrary();
  currentBookId = null;
  pdfDoc = null;
  pageTexts = {};
  enableControls(false);
}

// ─── screens ───
function showScreen(name) {
  document.getElementById('screen-library').classList.toggle('hidden', name !== 'library');
  document.getElementById('screen-reader').classList.toggle('hidden', name !== 'reader');
}

function showReaderState(state) {
  document.getElementById('reader-welcome').style.display = state === 'welcome' ? 'flex' : 'none';
  document.getElementById('reader-loading').style.display = state === 'loading' ? 'flex' : 'none';
  if (state !== 'content') document.getElementById('page-content').innerHTML = '';
}

// ── localStorage 同步備份（iOS kill page 前保證寫入）──
function savePositionSync() {
  if (!currentBookId) return;
  try { localStorage.setItem('pos_' + currentBookId, JSON.stringify({ p: currentPage, s: sentenceIdx })); } catch(e) {}
}
function getPositionSync(id) {
  try { const r = localStorage.getItem('pos_' + id); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

// ── save progress ──
async function saveNow() {
  if (!currentBookId || !pdfDoc) return;
  clearTimeout(saveDebounce);
  savePositionSync(); // 同步先存一份
  const book = await dbGet(currentBookId);
  if (!book) return;
  book.lastPage = currentPage;
  book.lastSentence = sentenceIdx;
  book.totalPages = totalPages;
  book.timerSeconds = timerSeconds;
  await dbPut(book);
}

async function saveProgress() {
  if (!currentBookId || !pdfDoc) return;
  clearTimeout(saveDebounce);
  savePositionSync(); // 每次頁面變動都同步存
  saveDebounce = setTimeout(saveNow, 800);
}

// ══════════════════════════════════════
//  TOC + Page rendering
// ══════════════════════════════════════
async function buildTOC() {
  const list = document.getElementById('toc-list');
  list.innerHTML = '';
  try {
    const outline = await pdfDoc.getOutline();
    if (outline?.length) {
      for (const item of outline) {
        const d = document.createElement('div');
        d.className = 'toc-item';
        d.textContent = item.title;
        d.onclick = async () => {
          try {
            let dest = item.dest;
            // named destination → resolve to array
            if (typeof dest === 'string') dest = await pdfDoc.getDestination(dest);
            if (Array.isArray(dest) && dest[0] != null) {
              const pageIdx = typeof dest[0] === 'number'
                ? dest[0]
                : await pdfDoc.getPageIndex(dest[0]);
              await renderPage(pageIdx + 1, 0);
            }
            closeDrawer();
          } catch(e) { console.warn('TOC nav:', e); }
        };
        list.appendChild(d);
      }
      return;
    }
  } catch {}
  const step = Math.max(1, Math.floor(totalPages / 30));
  for (let i = 1; i <= totalPages; i += step) {
    const d = document.createElement('div');
    d.className = 'page-item';
    d.textContent = `第 ${i} 頁`;
    d.dataset.page = i;
    d.onclick = () => { renderPage(i, 0); closeDrawer(); };
    list.appendChild(d);
  }
}

async function getPageText(n) {
  if (pageTexts[n]) return pageTexts[n];
  const page = await pdfDoc.getPage(n);
  const c = await page.getTextContent();
  pageTexts[n] = c.items.map(i => i.str).join('');
  return pageTexts[n];
}

async function renderPage(n, startSentence = 0) {
  if (!pdfDoc || n < 1 || n > totalPages) return;
  stopSpeech();
  currentPage = n;
  sentenceIdx = startSentence;
  document.getElementById('page-input').value = n;
  document.getElementById('pg-info').textContent = `${n} / ${totalPages}`;
  document.getElementById('progress-bar').style.width = ((n - 1) / totalPages * 100) + '%';

  document.querySelectorAll('.toc-item,.page-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll(`.page-item[data-page="${n}"]`).forEach(el => el.classList.add('active'));
  document.getElementById('btn-prev').disabled = n <= 1;
  document.getElementById('btn-next').disabled = n >= totalPages;

  const text = await getPageText(n);
  sentences = splitSentences(text);

  renderSentences();
  if (startSentence > 0) highlightSentence(startSentence, false);
  document.getElementById('reader').scrollTop = 0;
  saveProgress();
}

function splitSentences(text) {
  const c = text.replace(/\r\n|\r/g, '\n').replace(/[ \t]+/g, ' ').trim();
  const parts = c.split(/(?<=[。！？；…\n])/g).map(s => s.trim()).filter(s => s.length > 0);
  return parts.length ? parts : (c ? [c] : []);
}

function renderSentences() {
  const c = document.getElementById('page-content');
  c.innerHTML = '';
  sentences.forEach((s, i) => {
    const sp = document.createElement('span');
    sp.className = 'sentence';
    sp.dataset.idx = i;
    sp.textContent = s + ' ';
    c.appendChild(sp);
  });
}

function highlightSentence(idx, scroll = true) {
  document.querySelectorAll('.sentence').forEach((el, i) => {
    el.classList.toggle('done', i < idx);
    el.classList.toggle('speaking', i === idx);
  });
  if (scroll) {
    const el = document.querySelector(`.sentence[data-idx="${idx}"]`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  document.getElementById('sentence-info').textContent =
    sentences.length ? `${idx + 1} / ${sentences.length}` : '';
}

// ══════════════════════════════════════
//  Speech
// ══════════════════════════════════════
function togglePlay() {
  if (!sentences.length) return;
  if (speaking && !paused) pauseSpeech();
  else if (paused) resumeSpeech();
  else speakSentence(sentenceIdx);
}

function speakSentence(idx) {
  if (idx >= sentences.length) {
    if (currentPage < totalPages) renderPage(currentPage + 1, 0).then(() => speakSentence(0));
    else stopSpeech();
    return;
  }
  const text = sentences[idx].trim();
  if (!text) { speakSentence(idx + 1); return; }

  sentenceIdx = idx;
  speaking = true; paused = false;
  document.getElementById('btn-play').textContent = '⏸';
  document.getElementById('btn-stop').disabled = false;
  document.getElementById('btn-step').disabled = false;
  startTimer();
  highlightSentence(idx);
  saveProgress();

  if (edgeTtsUrl) {
    _speakEdge(idx, text);
  } else {
    _speakWeb(idx, text);
  }
}

async function _speakEdge(idx, text) {
  let blob;
  if (prefetchIdx === idx && prefetchBlob) {
    blob = prefetchBlob;
    prefetchIdx = -1; prefetchBlob = null;
  } else {
    try {
      const r = await fetch(`${edgeTtsUrl}/tts?` + new URLSearchParams({ text, voice: edgeTtsVoice }),
        { signal: AbortSignal.timeout(8000) });
      if (!r.ok) throw new Error();
      blob = await r.blob();
    } catch {
      _speakWeb(idx, text); // fallback
      return;
    }
  }
  const blobUrl = URL.createObjectURL(blob);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  currentAudio = new Audio(blobUrl);
  currentAudio.playbackRate = speed;
  currentAudio.onended = () => { URL.revokeObjectURL(blobUrl); if (!paused) speakSentence(idx + 1); };
  currentAudio.onerror = () => { URL.revokeObjectURL(blobUrl); if (!paused) speakSentence(idx + 1); };
  currentAudio.play();
  _prefetch(idx + 1);
}

async function _prefetch(idx) {
  if (idx >= sentences.length || !edgeTtsUrl || prefetchIdx === idx) return;
  const text = sentences[idx].trim();
  if (!text) return;
  try {
    const r = await fetch(`${edgeTtsUrl}/tts?` + new URLSearchParams({ text, voice: edgeTtsVoice }),
      { signal: AbortSignal.timeout(8000) });
    if (r.ok) { prefetchIdx = idx; prefetchBlob = await r.blob(); }
  } catch {}
}

function _speakWeb(idx, text) {
  utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = speed; utterance.pitch = 0.8; utterance.volume = 1; utterance.lang = 'zh-TW';
  if (selectedVoice) utterance.voice = selectedVoice;
  utterance.onend = () => { if (!paused) speakSentence(idx + 1); };
  utterance.onerror = (ev) => { if (ev.error !== 'interrupted' && ev.error !== 'canceled') speakSentence(idx + 1); };
  speechSynthesis.speak(utterance);
  clearInterval(speechWatchdog);
  speechWatchdog = setInterval(() => {
    if (speaking && !paused && !speechSynthesis.speaking && !speechSynthesis.pending) {
      clearInterval(speechWatchdog);
      speakSentence(sentenceIdx);
    }
  }, 2500);
}

function pauseSpeech() {
  if (edgeTtsUrl && currentAudio) {
    currentAudio.pause();
  } else {
    // iOS Safari 不支援 pause()，直接 cancel 並記住位置
    speechSynthesis.cancel();
    clearInterval(speechWatchdog);
  }
  paused = true; speaking = false;
  document.getElementById('btn-play').textContent = '▶';
  stopTimer();
}

function resumeSpeech() {
  if (edgeTtsUrl && currentAudio) {
    paused = false; speaking = true;
    document.getElementById('btn-play').textContent = '⏸';
    startTimer();
    currentAudio.play();
  } else {
    paused = false;
    speakSentence(sentenceIdx);
  }
}

function stopSpeech() {
  clearInterval(speechWatchdog);
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  prefetchIdx = -1; prefetchBlob = null;
  speechSynthesis.cancel(); speaking = false; paused = false; utterance = null;
  document.getElementById('btn-play').textContent = '▶';
  document.getElementById('btn-stop').disabled = true;
  document.getElementById('btn-step').disabled = true;
  stopTimer();
  document.querySelectorAll('.sentence').forEach(el => el.classList.remove('speaking','done'));
  document.getElementById('sentence-info').textContent = '';
}

function stepForward() {
  const was = speaking && !paused;
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  prefetchIdx = -1; prefetchBlob = null;
  speechSynthesis.cancel();
  sentenceIdx = Math.min(sentences.length - 1, sentenceIdx + 1);
  if (was) speakSentence(sentenceIdx); else highlightSentence(sentenceIdx);
}

function changeSpeed(v) {
  speed = parseFloat(v);
  if (edgeTtsUrl && currentAudio) {
    currentAudio.playbackRate = speed;
  } else if (speaking && !paused) {
    const i = sentenceIdx; speechSynthesis.cancel(); paused = false; speakSentence(i);
  }
}

// ══════════════════════════════════════
//  Navigation
// ══════════════════════════════════════
function prevPage() { if (currentPage > 1) renderPage(currentPage - 1, 0); }
function nextPage() { if (currentPage < totalPages) renderPage(currentPage + 1, 0); }
function jumpToPage() {
  const v = parseInt(document.getElementById('page-input').value);
  if (v >= 1 && v <= totalPages) renderPage(v, 0);
}
function seekProgress(e) {
  if (!totalPages) return;
  const r = e.currentTarget.getBoundingClientRect();
  const pg = Math.max(1, Math.min(totalPages, Math.round((e.clientX - r.left) / r.width * totalPages)));
  renderPage(pg, 0);
}

// ══════════════════════════════════════
//  Timer
// ══════════════════════════════════════
function startTimer() {
  if (timerInterval) return;
  timerInterval = setInterval(() => { timerSeconds++; updateTimer(); saveProgress(); }, 1000);
}
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }
function updateTimer() {
  const m = String(Math.floor(timerSeconds / 60)).padStart(2,'0');
  const s = String(timerSeconds % 60).padStart(2,'0');
  document.getElementById('timer-display').textContent = `${m}:${s}`;
  document.getElementById('timer-bar').style.width = Math.min(100, timerSeconds / GOAL * 100) + '%';
  if (timerSeconds >= GOAL) {
    document.getElementById('timer-display').style.color = '#5dba7e';
    document.getElementById('timer-label').textContent = '✓ 今日達標！';
  }
}

// ══════════════════════════════════════
//  Drawer + Font
// ══════════════════════════════════════
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
function setFont(px) {
  const v = parseInt(px);
  document.documentElement.style.setProperty('--font-size', v + 'px');
  document.getElementById('font-slider').value = v;
  document.getElementById('font-size-display').textContent = v + 'px';
}
function adjustFont(d) {
  const cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--font-size')) || 17;
  setFont(Math.max(13, Math.min(28, cur + d)));
}

function enableControls(on) {
  ['btn-prev','btn-play','btn-next'].forEach(id => document.getElementById(id).disabled = !on);
}

// swipe
let tx0 = 0;
document.getElementById('reader').addEventListener('touchstart', e => { tx0 = e.changedTouches[0].clientX; }, { passive: true });
document.getElementById('reader').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx0;
  if (Math.abs(dx) > 60) { if (dx < 0) nextPage(); else prevPage(); }
}, { passive: true });

// keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowRight') nextPage();
  if (e.code === 'ArrowLeft') prevPage();
  if (e.key === '+' || e.key === '=') adjustFont(1);
  if (e.key === '-') adjustFont(-1);
  if (e.code === 'Escape') goLibrary();
});

window.addEventListener('beforeunload', () => { clearInterval(speechWatchdog); speechSynthesis.cancel(); if (currentAudio) currentAudio.pause(); });

// pagehide：iOS 關閉 Safari 時最可靠的存檔時機
window.addEventListener('pagehide', () => {
  savePositionSync();
  // 嘗試同步寫 DB（iOS 可能沒時間跑完，但 localStorage 已存）
  if (currentBookId && pdfDoc) {
    dbGet(currentBookId).then(book => {
      if (!book) return;
      book.lastPage = currentPage;
      book.lastSentence = sentenceIdx;
      book.totalPages = totalPages;
      book.timerSeconds = timerSeconds;
      dbPut(book);
    });
  }
});

// 切回 app 時，若語音被 iOS kill 掉則自動重啟
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && speaking && !paused) {
    setTimeout(() => {
      if (!speechSynthesis.speaking && !speechSynthesis.pending) {
        speakSentence(sentenceIdx);
      }
    }, 400);
  }
  if (document.hidden) {
    savePositionSync(); // 同步 → iOS kill 前一定完成
    saveNow();          // 非同步 → 盡力寫入 DB
    if (speaking && !paused && !edgeTtsUrl) pauseSpeech();
  }
});

// ══════════════════════════════════════
//  Edge-TTS 設定
// ══════════════════════════════════════
function setEdgeTtsUrl(val) {
  edgeTtsUrl = val.trim().replace(/\/$/, '');
  localStorage.setItem('edgeTtsUrl', edgeTtsUrl);
  updateTtsStatus(null);
}

function setEdgeTtsVoice(val) {
  edgeTtsVoice = val;
  localStorage.setItem('edgeTtsVoice', val);
}

async function testEdgeTts() {
  if (!edgeTtsUrl) return;
  const btn = document.getElementById('tts-test-btn');
  btn.textContent = '…'; btn.disabled = true;
  try {
    const r = await fetch(`${edgeTtsUrl}/tts?` + new URLSearchParams({ text: '音質測試', voice: edgeTtsVoice }),
      { signal: AbortSignal.timeout(6000) });
    if (!r.ok) throw new Error();
    const blob = await r.blob();
    const a = new Audio(URL.createObjectURL(blob));
    a.play();
    updateTtsStatus(true);
  } catch {
    updateTtsStatus(false);
  }
  btn.textContent = '測試'; btn.disabled = false;
}

function updateTtsStatus(ok) {
  const dot = document.getElementById('tts-dot');
  const txt = document.getElementById('tts-status-text');
  if (!dot) return;
  if (ok === null) { dot.className = 'tts-dot'; txt.textContent = edgeTtsUrl ? '尚未測試' : '未設定（用系統聲）'; }
  else if (ok) { dot.className = 'tts-dot ok'; txt.textContent = '連線正常 ✓'; }
  else { dot.className = 'tts-dot err'; txt.textContent = '連線失敗，確認 Mac IP 與同一 WiFi'; }
}

// ── INIT ──
initLibrary();

// 初始化 Edge-TTS UI
document.getElementById('tts-server-input').value = edgeTtsUrl;
document.getElementById('tts-voice-select').value = edgeTtsVoice;
updateTtsStatus(edgeTtsUrl ? null : null);
</script>
